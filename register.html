<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | StoneGuard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
</head>
<body class="bg-tertiary">
    <!-- Theme & RTL Toggles -->
    <div class="position-fixed top-0 end-0 p-3 p-md-4 d-flex gap-2 auth-toggles" style="z-index: 2000;">
        <div class="rtl-toggle shadow-sm" id="rtlToggle">RTL</div>
        <div class="theme-toggle shadow-sm" id="themeToggle">
            <i class="bi bi-moon-stars-fill"></i>
        </div>
    </div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7 col-xl-6">
                <div class="card auth-card p-5 border-0 shadow-sm mt-4">
                    <div class="text-center mb-5">
                        <a href="index.html" class="navbar-brand d-flex align-items-center justify-content-center fs-2 fw-bold text-decoration-none">
                            <i class="bi bi-gem text-secondary-color me-2"></i>
                            <span class="text-primary-color">StoneGuard</span>
                        </a>
                        <p class="text-muted mt-2">Join us today! Create your account to start your restoration journey.</p>
                    </div>


                    <form action="dashboard.html">
                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <label class="form-label small fw-bold">Full Name</label>
                                <input type="text" class="form-control" placeholder="John Doe" required>
                            </div>
                            <div class="col-md-12 mb-3">
                                <label class="form-label small fw-bold">Email Address</label>
                                <input type="email" class="form-control" placeholder="name@example.com" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control border-end-0" id="password" required>
                                    <span class="input-group-text border-start-0 cursor-pointer" onclick="togglePassword('password')">
                                        <i class="bi bi-eye-slash" id="passwordIcon"></i>
                                    </span>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Confirm Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control border-end-0" id="confirmPassword" required>
                                    <span class="input-group-text border-start-0 cursor-pointer" onclick="togglePassword('confirmPassword')">
                                        <i class="bi bi-eye-slash" id="confirmPasswordIcon"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="terms" required>
                                <label class="form-check-label small text-muted" for="terms">
                                    I agree to the <a href="#" class="text-secondary-color text-decoration-none">Terms of Service</a> and <a href="#" class="text-secondary-color text-decoration-none">Privacy Policy</a>
                                </label>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100 py-3 fw-bold">Create Account</button>
                    </form>

                    <div class="position-relative my-4">
                        <hr>
                        <span class="position-absolute top-50 start-50 translate-middle px-3 text-muted small" style="background-color: transparent;">or</span>
                    </div>

                    <!-- Social Login Buttons -->
                    <div class="d-flex flex-column gap-3">
                        <button class="social-btn w-100">
                            <i class="bi bi-google me-2 text-danger"></i> Continue with Google
                        </button>
                        <button class="social-btn w-100">
                            <i class="bi bi-apple me-2 text-primary-color"></i> Continue with Apple
                        </button>
                    </div>
                    <div class="text-center mt-4">
                        <p class="small text-muted mb-0">Already have an account? <a href="login.html" class="text-secondary-color text-decoration-none fw-bold">Login</a></p>
                    </div>
                </div>
                <div class="text-center mt-4 mb-5">
                    <a href="index.html" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Homepage</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        function togglePassword(id) {
            const input = document.getElementById(id);
            const icon = document.getElementById(id + 'Icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            }
        }
    </script>
</body>
</html>
