<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StoneGuard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-tertiary">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-5 border-0 shadow-sm mt-5">
                    <div class="text-center mb-5">
                        <a href="index.html" class="navbar-brand d-flex align-items-center justify-content-center fs-2 fw-bold text-decoration-none text-dark">
                            <i class="bi bi-gem text-secondary-color me-2"></i>
                            <span>StoneGuard</span>
                        </a>
                        <p class="text-muted mt-2">Welcome back! Please login to your account.</p>
                    </div>
                    <form action="dashboard.html">
                        <div class="mb-4">
                            <label class="form-label small fw-bold">Email Address</label>
                            <input type="email" class="form-control" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <label class="form-label small fw-bold mb-0">Password</label>
                                <a href="#" class="text-secondary-color small text-decoration-none">Forgot Password?</a>
                            </div>
                            <div class="input-group">
                                <input type="password" class="form-control border-end-0" id="password" required>
                                <span class="input-group-text bg-white border-start-0 cursor-pointer" onclick="togglePassword('password')">
                                    <i class="bi bi-eye-slash" id="passwordIcon"></i>
                                </span>
                            </div>
                        </div>
                        <div class="mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label small text-muted" for="rememberMe">
                                    Remember me for 30 days
                                </label>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100 py-3 fw-bold">Login to Account</button>
                    </form>
                    <div class="text-center mt-4">
                        <p class="small text-muted mb-0">Don't have an account? <a href="register.html" class="text-secondary-color text-decoration-none fw-bold">Sign Up</a></p>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <a href="index.html" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Homepage</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(id) {
            const input = document.getElementById(id);
            const icon = document.getElementById(id + 'Icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            }
        }
    </script>
</body>
</html>
