<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StoneGuard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-tertiary">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-5 border-0 shadow-sm mt-5">
                    <div class="text-center mb-5">
                        <a href="index.html" class="navbar-brand fs-2 fw-bold text-decoration-none">StoneGuard</a>
                        <p class="text-muted">Welcome back! Please login.</p>
                    </div>
                    <form action="dashboard.html">
                        <div class="mb-4"><label class="form-label small fw-bold">Email</label><input type="email" class="form-control" required></div>
                        <div class="mb-4"><label class="form-label small fw-bold">Password</label><input type="password" class="form-control" required></div>
                        <button type="submit" class="btn btn-primary-custom w-100 py-3">Login</button>
                    </form>
                    <div class="text-center mt-4"><a href="register.html" class="text-decoration-none small">Don't have an account? Sign Up</a></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
